<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'none'; form-action 'self'; require-trusted-types-for 'script';">
  <meta name="description" content="Contact Uman — reach out for collaborations, questions, or just to say hello.">
  <title>Contact — Uman Debnath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@400;700&family=Delius&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header>
    <div class="header__inner">

      <a href="index.html" class="logo" aria-label="Uman Debnath — Home">kétchup</a>

      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>

      <button id="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false">
        🌙
      </button>

    </div>
  </header>

  <main>

    <section class="page-hero" aria-labelledby="contact-heading">
      <div class="container">

        <h1 id="contact-heading" class="animate-stagger-1">Get In Touch</h1>

        <p class="page-hero__subtitle animate-stagger-2">
          Have a question, idea, or just want to say hi? Fill in the form below.
        </p>

      </div>
    </section>

    <section class="contact-section scroll-reveal" aria-labelledby="contact-heading">
      <div class="container">

        <div class="contact__form-wrapper">

            <form
              id="contact-form"
              class="contact-form"
              novalidate
            >

              <div class="form__group">

                <label for="name" class="form__label">
                  Your Name
                  <span class="form__required" aria-hidden="true">*</span>
                </label>

                <input
                  type="text"
                  id="name"
                  name="name"
                  class="form__input"
                  autocomplete="name"
                  aria-required="true"
                  aria-describedby="name-error"
                  placeholder="Your full name"
                >

                <span
                  id="name-error"
                  class="form__error"
                  role="alert"
                  aria-live="polite"
                ></span>

              </div>

              <div class="form__group">

                <label for="email" class="form__label">
                  Email Address
                  <span class="form__required" aria-hidden="true">*</span>
                </label>

                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form__input"
                  autocomplete="email"
                  aria-required="true"
                  aria-describedby="email-error"
                  placeholder="you@example.com"
                >

                <span id="email-error" class="form__error" role="alert" aria-live="polite"></span>

              </div>

              <div class="form__group">

                <label for="subject" class="form__label">
                  Subject
                  <span class="form__required" aria-hidden="true">*</span>
                </label>

                <input
                  type="text"
                  id="subject"
                  name="subject"
                  class="form__input"
                  aria-required="true"
                  aria-describedby="subject-error"
                  placeholder="What's this about?"
                >

                <span id="subject-error" class="form__error" role="alert" aria-live="polite"></span>

              </div>

              <div class="form__group">

                <label for="message" class="form__label">
                  Message
                  <span class="form__required" aria-hidden="true">*</span>
                </label>

                <textarea
                  id="message"
                  name="message"
                  class="form__input form__textarea"
                  rows="5"
                  aria-required="true"
                  aria-describedby="message-error"
                  placeholder="What's on your mind?"
                ></textarea>

                <span id="message-error" class="form__error" role="alert" aria-live="polite"></span>

              </div>

              <div class="form__actions">

                <button
                  type="submit"
                  id="submit-btn"
                  class="btn btn--primary"
                >
                  Send Message
                </button>

              </div>

            </form>

            <div
              id="contact-success"
              class="contact__success"
              role="status"
              aria-live="polite"
              hidden
            >

              <div class="contact__success-icon" aria-hidden="true">
                ✓
              </div>

              <h2 class="contact__success-title">Message Sent!</h2>

              <p class="contact__success-body">
                Thanks for reaching out. I'll get back to you soon.
              </p>

              <button
                id="reset-btn"
                class="btn btn--secondary"
                type="button"
              >
                Send Another Message
              </button>

            </div>

        </div>

      </div>
    </section>

  </main>

  <footer>
    <div class="footer__inner">
      <p>© 2026 Uman Debnath. Built with HTML, CSS, and JavaScript.</p>

      <nav aria-label="Social links">
        <ul>
          <li>
            <a href="https://github.com/ketc8up" target="_blank" rel="noopener noreferrer">
              GitHub
            </a>
          </li>
          <li>
            <a href="https://linkedin.com/in/uman-debnath-99292a1b2/" target="_blank" rel="noopener noreferrer">
              LinkedIn
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/contact.js"></script>

</body>
</html>
